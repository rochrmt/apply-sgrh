# SIGRHE · Nginx installé sur le serveur (sans Docker) : /etc/nginx/sites-available/sigrhe
server {
    listen 80;
    server_name sigrhe.gouv.cf;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name sigrhe.gouv.cf;
    ssl_certificate     /etc/letsencrypt/live/sigrhe.gouv.cf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sigrhe.gouv.cf/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 25m;
    proxy_read_timeout 160s;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
